name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment already in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # One JSON file per unit (replaces the old /:server/unit/:id server endpoint).
      # Uses only Node built-ins, so no npm install is needed.
      - name: Generate per-unit files
        run: node tools/generateUnitFiles.js --force

      - run: npm ci

      # Data (GL, JP), images and the generated unit files live in public/ and are copied into the build as they are;
      # the extraction scripts and tools/custom are not, so they never reach the site.
      - name: Build the site
        run: npx ng build

      # GitHub Pages serves 404.html for unknown paths: the copy of index.html lets the Angular router handle /builder, ...
      - name: Add the 404 fallback
        run: |
          cp dist/ffbe-equip-reborn/browser/index.html dist/ffbe-equip-reborn/browser/404.html
          du -sh dist/ffbe-equip-reborn/browser

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/ffbe-equip-reborn/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
