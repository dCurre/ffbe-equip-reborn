name: Suggestion
description: Propose an improvement or a new feature
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion
      description: What would you like to see improved or added?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The problem it solves or how you would use it.
