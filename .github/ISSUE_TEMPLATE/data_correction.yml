name: Item data correction
description: Correct how an item can be obtained (access) or how many can be obtained (max number)
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        The easiest way to fill this form is the Contribute page of the site
        (https://dcurre.github.io/ffbe-equip-reborn/contribute.html): select the items to correct and
        it prepares this issue for you.
  - type: input
    id: server
    attributes:
      label: Game version
      description: GL (Global) or JP (Japanese)
      placeholder: GL
    validations:
      required: true
  - type: textarea
    id: corrections
    attributes:
      label: Corrections
      description: Item id, name and the corrected access / max number.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes or sources
      description: Optional — where does this information come from?
