@for (kind of kinds; track kind) {
  <div [class]="kind">
    @for (group of groups()[kind]; track group.percent) {
      <app-value-group class="group" [class.selected]="isSelected(kind, group.races)">
        @for (race of group.races; track race) {
          <app-icon [name]="'killer-' + kind + '-' + race" size="var(--killer-size, 40px)" />
        }
        @if (group.percent > 300) {
          <span value class="over" [title]="t.only300TakenInto">{{ group.percent }}%</span>
        } @else {
          <span value>{{ group.percent }}%</span>
        }
      </app-value-group>
    }
  </div>
}
