@if (notStackable()) {
  <app-icon class="miniIcon left" name="not-stackable" [title]="t.notStackable" size="22" />
}
@if (twoHanded()) {
  <app-icon class="miniIcon left" name="two-handed" [title]="t.twoHanded" size="22" />
}
@if (item().icon) {
  <img [src]="'img/items/' + item().icon" class="icon" loading="lazy" alt="" />
} @else if (item().type === 'esper') {
  <app-icon [name]="icon()" class="icon" size="64" />
} @else if (item().type !== 'unavailable') {
  <app-icon [name]="'equipment-' + item().type" class="icon" size="64" />
}
