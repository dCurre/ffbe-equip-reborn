@if (notStackable()) {
  <img class="miniIcon left" src="img/icons/notStackable.png" title="Not stackable" alt="" />
}
@if (twoHanded()) {
  <img class="miniIcon left" src="img/icons/twoHanded.png" title="Two-handed" alt="" />
}
@if (item().icon) {
  <img [src]="'img/items/' + item().icon" class="icon" loading="lazy" alt="" />
} @else if (item().type === 'esper') {
  <i [class]="'img icon img-esper-' + esperName()"></i>
} @else if (item().type !== 'unavailable') {
  <i [class]="'img icon img-equipment-' + item().type"></i>
}
