@if (resist()) {
  <div class="groups">
    @for (group of elements(); track group.percent) {
      <app-value-group class="group">
        @for (name of group.names; track name) {
          <span class="value" [title]="name + (icon() === 'sword' ? ' infliction' : ' resist')">
            <app-icon [name]="'equipment-' + icon()" class="mini" size="calc(var(--resist-size, 38px) * 0.58)" /><app-icon [name]="'element-' + name" class="with-mini" size="var(--resist-size, 38px)" />
          </span>
        }
        <span value [class.bonus]="group.bonus > 0">{{ group.percent }}%</span>
      </app-value-group>
    }
  </div>
  <div class="groups">
    @for (group of ailments(); track group.percent) {
      <app-value-group class="group">
        @for (name of group.names; track name) {
          <span class="value" [title]="name + (icon() === 'sword' ? ' infliction' : ' resist')">
            <app-icon [name]="'equipment-' + icon()" class="mini" size="calc(var(--resist-size, 38px) * 0.58)" /><app-icon [name]="'ailment-' + name" class="with-mini" size="var(--resist-size, 38px)" />
          </span>
        }
        <span value [class.bonus]="group.bonus > 0">{{ group.percent }}%</span>
      </app-value-group>
    }
  </div>
}
