<div class="equipable">
  @for (entry of s.equipable(); track entry.type) {
    <span
      class="slot"
      [class.unusable]="!entry.usable"
      [title]="tooltip(entry)"
      (click)="entry.usable && toggleEquipable(entry.type)"
    >
      <app-icon [name]="'equipment-' + entry.type" size="36" />
      @if (entry.banned) {
        <app-icon class="banned" name="ban-bold" />
      }
      @if (entry.usable && entry.boosted) {
        <app-icon class="boosted" name="double-up" />
      }
    </span>
  }
</div>
