<app-panel>
  <div panelHeading class="heading">
    <span>{{ teams().title() }}</span>
    <span class="buttons">
      @if (hasUnits()) {
        <button
          app-button
          variant="flat"
          type="button"
          [title]="t.save"
          [attr.aria-label]="t.save"
          (click)="saveClicked()"
        >
          <app-icon name="save" />
        </button>
      }
      @if (teams().current() >= 0) {
        <button
          app-button
          variant="flat"
          type="button"
          [title]="t.saveAs"
          [attr.aria-label]="t.saveAs2"
          (click)="nameOpen.set(true)"
        >
          <app-icon name="add-box" />
        </button>
      }
      <button
        app-button
        variant="flat"
        type="button"
        [title]="t.showSavedTeamsList"
        [attr.aria-label]="t.savedTeamsList"
        (click)="showList()"
      >
        <app-icon name="list" />
      </button>
    </span>
  </div>
</app-panel>

<app-modal [heading]="t.savedTeams" [wide]="true" [(open)]="listOpen">
  @for (entry of entries(); track entry.index) {
    <div class="team">
      <div>
        <div class="name">{{ entry.saved.name }}</div>
        <div class="units">
          @for (unit of entry.saved.team.units; track $index) {
            <img class="unit" [src]="'img/units/unit_icon_' + unit.id + '.png'" alt="" />
          }
        </div>
      </div>
      <div class="actions">
        <button app-button type="button" [title]="t.addThisTeamTo" (click)="importClicked(entry.index)">
          {{ t.import }}
        </button>
        <button app-button type="button" [title]="t.loadThisTeamTo" (click)="loadClicked(entry.index)">
          {{ t.load }}
        </button>
        <button
          app-button
          type="button"
          [title]="t.deleteThisTeam"
          [attr.aria-label]="t.deleteThisTeam"
          (click)="deleteClicked(entry.index)"
        >
          <app-icon name="remove" />
        </button>
      </div>
    </div>
  } @empty {
    <p>{{ t.noSavedTeamYet }}</p>
  }
</app-modal>

<app-modal [heading]="t.saveTeamAs" confirmLabel="Save" [(open)]="nameOpen" (confirmed)="confirmName()">
  <app-input-group [label]="t.buildName">
    <input type="text" [value]="name()" (input)="name.set($any($event.target).value)" (keydown.enter)="confirmName()" />
  </app-input-group>
</app-modal>

<app-modal [heading]="t.loadSavedTeam" confirmLabel="Load" [(open)]="loadOpen" (confirmed)="confirmLoad()">
  <p>{{ t.loadingThisTeamWill }}</p>
</app-modal>

<app-modal
  [heading]="t.deleteTeam"
  confirmLabel="Delete"
  [danger]="true"
  [(open)]="deleteOpen"
  (confirmed)="confirmDelete()"
>
  <p>{{ t.areYouSureTo }}</p>
</app-modal>
