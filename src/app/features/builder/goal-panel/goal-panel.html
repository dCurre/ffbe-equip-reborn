@if (s.unit()) {
  <app-panel>
    <div panelHeading class="heading"><span>Goal</span></div>
    <div class="goal">
      <div class="line">
        <select [value]="s.goalChoice()" (change)="chooseGoal($any($event.target).value)">
          @for (option of s.goalOptions(); track option.value) {
            <option [value]="option.value" [disabled]="option.disabled" [selected]="option.value === s.goalChoice()">
              {{ option.label }}
            </option>
          }
          @if (s.customFormula()) {
            <option value="custom" [selected]="s.goalChoice() === 'custom'">Custom formula</option>
          }
        </select>
        <button app-button type="button" title="Write the goal as a formula" (click)="customGoal().show()">
          Formula
        </button>
        <label>
          Variance
          <select [value]="s.goalVariation()" (change)="s.goalVariation.set($any($event.target).value); s.refresh()">
            @for (variation of variations; track variation[0]) {
              <option [value]="variation[0]">{{ variation[1] }}</option>
            }
          </select>
        </label>
      </div>
      @for (time of s.multicastTimes(); track time) {
        <div class="line">
          <select [value]="s.multicastSelection()[time]" (change)="chooseMulticast(time, $any($event.target).value)">
            @for (option of s.multicastOptions(); track option.id) {
              <option [value]="option.id" [selected]="option.id === s.multicastSelection()[time]">
                {{ option.name }}
              </option>
            }
          </select>
        </div>
      }
      <label class="line">
        Chain multiplier
        <input
          type="text"
          class="short"
          placeholder="1 or MAX"
          [value]="s.chainMultiplier()"
          (input)="s.chainMultiplier.set($any($event.target).value); s.refresh()"
        />
      </label>
      @if (s.showStack()) {
        <label class="line">
          Stack
          <input
            type="number"
            min="0"
            class="short"
            [value]="s.stack()"
            (input)="s.stack.set($any($event.target).value); s.refresh()"
          />
        </label>
      }
      <div class="line">
        <span class="label">Force elements</span>
        <app-choice-group
          [choices]="forcedElementChoices"
          iconType="element"
          [selected]="s.forcedElements()"
          (selectedChange)="s.forcedElements.set($event); s.refresh()"
        />
      </div>
      <div class="line">
        <span class="label">Immune to</span>
        <app-choice-group
          [choices]="ailmentChoices"
          iconType="ailment"
          [selected]="s.ailmentImmunities()"
          (selectedChange)="s.ailmentImmunities.set($event); s.refresh()"
        />
      </div>
      <div class="line">
        <span class="label">Resist</span>
        <span class="resists">
          @for (element of elements; track element) {
            <label class="resist"
              ><i [class]="'img img-element-' + element"></i>
              <input
                type="number"
                min="0"
                max="300"
                [value]="s.goalResists()[element]"
                (input)="setGoalResist(element, $event)"
              />
            </label>
          }
        </span>
      </div>
      <div class="line">
        <app-choice-group
          [choices]="variousChoices"
          [selected]="s.various()"
          (selectedChange)="s.various.set($event); s.refresh()"
        />
      </div>
    </div>
  </app-panel>
}
