@if (s.unit()) {
  <div class="goal">
    <div class="line">
      <span class="label">Maximize</span>
      @if (s.customFormula()) {
        <span class="custom">Custom Goal:</span>
        <button app-button variant="link" type="button" title="Change the formula" (click)="customGoal().show()">
          {{ customText() }}
        </button>
        <button
          app-button
          variant="link"
          type="button"
          title="Remove the custom goal"
          aria-label="Remove the custom goal"
          (click)="customGoal().remove()"
        >
          <app-icon name="remove" />
        </button>
      } @else {
        <app-rich-select
          class="goal-select"
          [options]="goalChoices()"
          [value]="s.goalChoice()"
          (picked)="chooseGoal($event)"
        />
        <span>
          or
          <button app-button variant="link" type="button" (click)="customGoal().show()">Custom Goal</button>
        </span>
      }
    </div>
      @for (time of s.multicastTimes(); track time) {
        <div class="line">
          <span class="label">Skill {{ time + 1 }}</span>
          <select [value]="s.multicastSelection()[time]" (change)="chooseMulticast(time, $any($event.target).value)">
            @for (option of s.multicastOptions(); track option.id) {
              <option [value]="option.id" [selected]="option.id === s.multicastSelection()[time]">
                {{ option.name }}
              </option>
            }
          </select>
        </div>
      }
      @if (s.showStack()) {
        <label class="line">
          <span class="label">Skill stack</span>
          <input
            type="number"
            min="0"
            class="short"
            [value]="s.stack()"
            (input)="s.stack.set($any($event.target).value); s.refresh()"
          />
        </label>
      }
      <div class="line">
        <button
          app-button
          type="button"
          title="Display/Hide additional build conditions"
          [attr.aria-expanded]="optionsOpen()"
          (click)="optionsOpen.set(!optionsOpen())"
        >
          {{ optionsOpen() ? '−' : '+' }} options
        </button>
      </div>
      @if (optionsOpen()) {
      <div class="options more">
        <label class="line">
          <span class="label">Chain Mult.</span>
          <input
            type="text"
            class="short"
            [value]="s.chainMultiplier()"
            (input)="s.chainMultiplier.set($any($event.target).value); s.refresh()"
          />
          <span class="hint"
            >(<button app-button variant="link" type="button" class="switch" (click)="setChainMax()">MAX</button> for max chain multiplier)</span
          >
        </label>
        <div class="line">
          <span class="label">Force element</span>
          <app-choice-group
            [choices]="forcedElementChoices"
            iconType="element"
            [selected]="s.forcedElements()"
            (selectedChange)="s.forcedElements.set($event); s.refresh()"
          />
        </div>
        <div class="line">
          <button
            app-button
            variant="link"
            type="button"
            class="label switch"
            title='Switch between "All ailment", "Disabling ailments" and "No ailments"'
            (click)="switchAilments()"
          >
            Ailment Immunity
          </button>
          <app-choice-group
            [choices]="ailmentChoices"
            iconType="ailment"
            [selected]="s.ailmentImmunities()"
            (selectedChange)="s.ailmentImmunities.set($event); s.refresh()"
          />
        </div>
        <div class="line">
          <span class="label">Elemental resist</span>
          <span class="resists">
            @for (element of elements; track element) {
              <span class="resist">
                <span class="element">
                  <app-icon [name]="'element-' + element" size="28" />
                  <app-icon class="shield" name="equipment-heavyShield" size="14" />
                </span>
                <app-number-field
                  [width]="60"
                  [title]="'Base ' + element + ' resistance'"
                  [value]="s.goalResists()[element]"
                  (valueChange)="setGoalResist(element, $event)"
                />
              </span>
            }
          </span>
        </div>
        <div class="line">
          <span class="label">Various</span>
          <app-choice-group
            [choices]="variousChoices"
            [selected]="s.various()"
            (selectedChange)="s.various.set($event); s.refresh()"
          />
        </div>
      </div>
      }
    </div>
}
