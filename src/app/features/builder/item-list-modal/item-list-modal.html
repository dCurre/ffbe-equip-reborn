<app-modal [heading]="kind() === 'exclude' ? 'Excluded items' : 'Included items'" [wide]="true" [(open)]="open">
  @for (item of entries(); track item.id) {
    <div class="entry">
      <button
        app-button
        variant="flat"
        type="button"
        [title]="t.removeFromTheList"
        [attr.aria-label]="t.removeFromTheList"
        (click)="remove('' + item.id)"
      >
        <app-icon name="remove" />
      </button>
      <app-item-line
        [item]="item"
        [units]="items().pickerContext().units"
        [enchantments]="items().pickerContext().enchantments"
      />
    </div>
  } @empty {
    <p>{{ t.noItemInThe }}</p>
  }
  <ng-container modalFooter>
    <button app-button type="button" [disabled]="!entries().length" (click)="reset()">{{ t.resetTheList }}</button>
    <button app-button type="button" (click)="add.emit()">{{ t.addItems }}</button>
  </ng-container>
</app-modal>
