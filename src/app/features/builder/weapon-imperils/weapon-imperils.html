<div class="line">
  <button app-button type="button" (click)="open.set(!open())"><app-icon name="edit" /> {{ t.weaponImperils }}</button>
  @if (!open()) {
    @for (item of active(); track item.weapon) {
      <span class="summary"
        ><app-icon [name]="'equipment-' + item.weapon" width="34" height="38" />{{ item.value }}%</span
      >
    }
  }
</div>
@if (open()) {
  <div class="weapons">
    @for (weapon of weapons; track weapon) {
      <div class="weapon">
        <app-icon [name]="'equipment-' + weapon" width="34" height="38" [title]="spaced(weapon) + ' imperil'" />
        <app-input-group>
          <app-number-field
            [min]="0"
            withIcon
            suffix="%"
            [value]="s.monsterImperils()[weapon] ?? ''"
            (valueChange)="set(weapon, $event)"
          >
            <app-icon leading name="arrow-down" [title]="t.debuff" />
          </app-number-field>
        </app-input-group>
      </div>
    }
  </div>
}
