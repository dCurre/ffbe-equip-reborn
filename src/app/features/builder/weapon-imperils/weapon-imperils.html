<div class="line">
  <button app-button type="button" (click)="open.set(!open())"><app-icon name="edit" /> Weapon imperils</button>
  @if (!open()) {
    @for (item of active(); track item.weapon) {
      <span class="summary"><app-icon [name]="'equipment-' + item.weapon" width="34" height="38" />{{ item.value }}%</span>
    }
  }
</div>
@if (open()) {
  <div class="weapons">
    @for (weapon of weapons; track weapon) {
      <div class="weapon">
        <app-icon [name]="'equipment-' + weapon" width="34" height="38" [title]="weapon + ' imperil'" />
        <app-input-group>
          <app-number-field [min]="0"
            withIcon
            suffix="%"
            [tone]="tone(s.monsterImperils()[weapon], false)"
            [title]="weapon + ' imperil (positive)'"
            [value]="s.monsterImperils()[weapon] ?? ''"
            (valueChange)="set(weapon, $event)"
          >
            <app-icon leading name="arrow-down" />
          </app-number-field>
        </app-input-group>
      </div>
    }
  </div>
}
