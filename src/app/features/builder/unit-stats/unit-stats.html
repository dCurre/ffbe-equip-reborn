<div class="stats-grid">
  @for (stat of mainStats; track stat) {
    <app-input-group [label]="stat.toUpperCase()" [class.no-buff]="stat === 'mp'">
      <span class="base" [title]="stat.toUpperCase() + ' base stat'">{{ s.build().getStat(stat) }}</span>
      <app-number-field
        withIcon
        [min]="0"
        [tone]="potClass(stat)"
        [title]="stat.toUpperCase() + ' pots'"
        [value]="s.pots()[stat]"
        (valueChange)="setPot(stat, $event)"
      >
        <button app-button variant="flat" leading type="button" title="pots" (click)="cyclePot(stat)">
          <app-icon name="add" />
        </button>
      </app-number-field>
      @if (stat !== 'mp') {
        <app-number-field
          withIcon
          [min]="0"
          [suffix]="stat === 'hp' ? '' : '%'"
          [title]="stat === 'hp' ? 'HP barrier' : stat.toUpperCase() + ' buff'"
          [value]="s.buffs()[stat]"
          (valueChange)="setBuff(stat, $event)"
        >
          @if (stat === 'hp') {
            <app-icon leading name="equipment-heavyShield" size="16" title="HP barrier" />
          } @else {
            <app-icon leading name="arrow-up" title="buff" />
          }
        </app-number-field>
      }
    </app-input-group>
  }
  @for (row of rows; track row.key) {
    <app-input-group class="wide" [label]="row.label">
      <app-number-field
        withIcon
        [min]="0"
        [suffix]="row.suffix"
        [title]="row.label"
        [value]="rowValue(row.key)"
        (valueChange)="setRow(row.key, $event)"
      >
        @if (row.suffix) {
          <app-icon leading name="arrow-up" title="buff" />
        }
      </app-number-field>
    </app-input-group>
  }
</div>
