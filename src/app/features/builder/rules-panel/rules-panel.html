<app-panel>
  <div panelHeading class="heading"><span>Build rules</span></div>
  <div class="options">
    <label
      ><input
        type="checkbox"
        [checked]="s.forceDoubleHand()"
        (change)="s.forceDoubleHand.set($any($event.target).checked); s.forceDualWield.set(false)"
      />
      Force two-handed weapon</label
    >
    <label
      ><input
        type="checkbox"
        [checked]="s.forceDualWield()"
        (change)="s.forceDualWield.set($any($event.target).checked); s.forceDoubleHand.set(false)"
      />
      Force dual wield</label
    >
    <label
      ><input
        type="checkbox"
        [checked]="s.tryEquipSources()"
        (change)="s.tryEquipSources.set($any($event.target).checked)"
      />
      Try equipment that gives access to more equipment</label
    >
    <div class="line">
      <label
        ><input
          type="checkbox"
          [checked]="s.tryReduceOvercap()"
          (change)="s.tryReduceOvercap.set($any($event.target).checked)"
        />
        Try to reduce overcap in favor of</label
      >
      <select [value]="s.reduceOvercapStat()" (change)="s.reduceOvercapStat.set($any($event.target).value)">
        @for (stat of overcapStats; track stat[0]) {
          <option [value]="stat[0]" [selected]="stat[0] === s.reduceOvercapStat()">{{ stat[1] }}</option>
        }
      </select>
    </div>
    @if (s.unit()?.max_rarity === 7 || s.unit()?.max_rarity === 'NV') {
      <label
        ><input
          type="checkbox"
          [checked]="s.forceTmrAbility()"
          (change)="s.forceTmrAbility.set($any($event.target).checked)"
        />
        <span class="experimental">Experimental</span> Force use of TMR or STMR</label
      >
    }
    <label
      ><input
        type="checkbox"
        [checked]="s.useElementConditionedMateria()"
        (change)="s.useElementConditionedMateria.set($any($event.target).checked)"
      />
      Try element conditioned materia (like Electrifying Might)</label
    >
    <label class="line">
      Cores used
      <input
        type="number"
        min="1"
        max="16"
        class="short"
        [value]="s.workerCount()"
        (change)="workers.emit($any($event.target).value)"
      />
    </label>
  </div>
</app-panel>
