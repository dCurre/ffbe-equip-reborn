<app-panel>
  <div panelHeading class="heading">
    <span>{{ t.buildRules }}</span>
  </div>
  <div class="options">
    <div class="pair">
      <app-checkbox
        [checked]="s.forceDoubleHand()"
        (checkedChange)="s.forceDoubleHand.set($event); s.forceDualWield.set(false)"
      >
        {{ t.forceDoublehandBuild }}
      </app-checkbox>
      <app-checkbox
        [checked]="s.forceDualWield()"
        (checkedChange)="s.forceDualWield.set($event); s.forceDoubleHand.set(false)"
      >
        {{ t.forceDualWieldBuild }}
      </app-checkbox>
    </div>
    <app-checkbox [(checked)]="s.tryEquipSources">{{ t.tryAllowUseOf }}</app-checkbox>
    <div class="line">
      <app-checkbox [(checked)]="s.tryReduceOvercap">{{ t.tryToReduceOvercap }}</app-checkbox>
      <select [value]="s.reduceOvercapStat()" (change)="s.reduceOvercapStat.set($any($event.target).value)">
        @for (stat of overcapStats; track stat[0]) {
          <option [value]="stat[0]" [selected]="stat[0] === s.reduceOvercapStat()">{{ stat[1] }}</option>
        }
      </select>
    </div>
    @if (s.unit()?.max_rarity === 7 || s.unit()?.max_rarity === 'NV') {
      <app-checkbox [(checked)]="s.forceTmrAbility">
        <span class="experimental">{{ t.experimental }}</span> {{ t.forceUseOfTmr }}
      </app-checkbox>
    }
    <app-checkbox [(checked)]="s.useElementConditionedMateria">
      {{ t.tryElementConditionedMateria }}
    </app-checkbox>
    <label class="line">
      <span class="label">{{ t.damageVariance }}</span>
      <select [value]="s.goalVariation()" (change)="s.goalVariation.set($any($event.target).value); s.refresh()">
        @for (variation of variations; track variation[0]) {
          <option [value]="variation[0]" [selected]="variation[0] === s.goalVariation()">{{ variation[1] }}</option>
        }
      </select>
    </label>
  </div>
</app-panel>
