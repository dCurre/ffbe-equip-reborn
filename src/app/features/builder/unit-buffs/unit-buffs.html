<div class="line">
  <button app-button type="button" (click)="open.set(!open())"><app-icon name="edit" /> {{ t.killerBuffs }}</button>
  @if (!open()) {
    @for (tile of summary(); track tile.kind + tile.name) {
      <app-icon-tile
        [icon]="'killer-' + tile.kind + '-' + tile.name"
        [value]="tile.value"
        [tooltip]="tile.name + ' ' + tile.kind + ' killer'"
      />
    }
  }
</div>
@if (open()) {
  @for (kind of kinds; track kind) {
    <div class="buffs">
      @for (name of killerNames; track name) {
        <div class="buff">
          <app-icon [name]="'killer-' + kind + '-' + name" size="38" [title]="name + ' ' + kind + ' killer buff'" />
          <app-input-group>
            <app-number-field
              withIcon
              suffix="%"
              [min]="0"
              [value]="s.killerBuffs()[name]?.[kind] ?? ''"
              (valueChange)="setKillerBuff(name, kind, $event)"
            >
              <app-icon leading name="arrow-up" [title]="t.buff" />
            </app-number-field>
          </app-input-group>
        </div>
      }
    </div>
  }
}
<div class="buffs">
  @for (element of elements; track element) {
    <div class="buff">
      <app-icon [name]="'element-' + element" size="38" [title]="ucFirst(element) + ' element damage boost'" />
      <app-input-group>
        <app-number-field
          withIcon
          suffix="%"
          [min]="0"
          [value]="s.elementBuffs()[element] ?? ''"
          (valueChange)="setElementBuff(element, $event)"
        >
          <app-icon leading name="arrow-up" [title]="t.buff" />
        </app-number-field>
      </app-input-group>
    </div>
  }
</div>
