<div class="tabs" role="tablist">
  @for (name of names(); track $index; let i = $index) {
    <div class="tab" role="presentation" [class.active]="i === active()">
      <button
        app-button
        variant="flat"
        type="button"
        role="tab"
        [attr.aria-selected]="i === active()"
        [disabled]="disabled()"
        (click)="active.set(i)"
      >
        @if (icons()[i]) {
          <img class="unit-icon" [src]="icons()[i]" alt="" />
        }
        {{ name }}
      </button>
      @if (names().length > 1) {
        <button
          app-button
          variant="flat"
          type="button"
          class="close"
          [disabled]="disabled()"
          [attr.aria-label]="t.closeTab"
          (click)="close.emit(i)"
        >
          <app-icon name="remove" />
        </button>
      }
    </div>
  }
  @if (names().length < max()) {
    <button
      app-button
      variant="flat"
      type="button"
      class="add"
      [disabled]="disabled()"
      [attr.aria-label]="t.newTab"
      (click)="add.emit()"
    >
      <app-icon name="add" />
    </button>
  }
</div>
