<div class="line">
  <span>Monster attack:</span>
  <a href="#" (click)="$event.preventDefault(); show()">{{ formulaToString(s.monsterAttackFormula(), false) }}</a>
  <button app-button variant="link" type="button" class="reset" title="Back to the default attack" (click)="reset()">
    <app-icon name="remove" />
  </button>
</div>

<app-modal heading="Monster Attack Formula" confirmLabel="OK" [(open)]="open" (confirmed)="apply()">
  <input
    type="text"
    placeholder="Enter monster damage formula"
    [value]="text()"
    (input)="text.set($any($event.target).value)"
    (keydown.enter)="apply()"
  />
</app-modal>
