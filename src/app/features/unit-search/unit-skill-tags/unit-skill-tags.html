@for (icon of icons(); track icon) {
  <app-icon [name]="'equipment-' + icon" size="28" />
}
@for (element of elements(); track element) {
  <app-icon [name]="'element-' + element" size="28" />
}
@for (family of families(); track family.label) {
  <span class="chainFamily"
    ><span class="bullet" [title]="family.title"><span class="chainIcon"><app-icon name="link" /></span></span
    >{{ family.label }}</span
  >
}
