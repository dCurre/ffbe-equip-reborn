@if (effect()?.resist) {
  @for (group of groups(); track group.value) {
    @if (!$first) {
      ,
    }
    +{{ group.value }}%
    @for (resist of group.resists; track resist.name) {
      <app-icon name="equipment-heavyShield" class="miniIcon" size="18" /><app-icon [name]="(resist.element ? 'element-' : 'ailment-') + resist.name" class="withMiniIcon" size="30" />
    }
  }
  {{ turns() }}
  @if (effect().equipedConditions) {
    <app-unit-equiped-condition [conditions]="effect().equipedConditions" />
  }
} @else {
  {{ text() }}
}
