<div class="skill">
  <div><app-icon class="skillIcon" name="limit-burst" size="45" /></div>
  <div class="nameAndEffects">
    <span class="name"
      >{{ t.limitBurst }} {{ lb().name }}<app-unit-skill-tags [skill]="lb()" [effects]="lb().maxEffects"
    /></span>
    <app-unit-strange-stats [effects]="lb().maxEffects" />
    <div class="subSkill">
      <span class="case">{{ t.min }}</span>
      <div class="skill">
        <div class="nameAndEffects">
          @for (effect of lb().minEffects; track $index) {
            <app-unit-effect [entry]="effect" skillId="0" />
          }
        </div>
      </div>
    </div>
    <div class="subSkill">
      <span class="case">{{ t.max }}</span>
      <div class="skill">
        <div class="nameAndEffects">
          @for (effect of lb().maxEffects; track $index) {
            <app-unit-effect [entry]="effect" skillId="0" />
          }
        </div>
      </div>
    </div>
  </div>
</div>
