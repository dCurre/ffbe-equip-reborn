@if (strange(); as strange) {
  <span class="strangeStatsUsed"
    ><span class="warnIcon"><app-icon name="alert" /></span>{{ t.uses }} <span class="stat">{{ strange.stat }}</span>
    @if (strange.monsterStat) {
      {{ t.toDamageMonster }} <span class="monsterStat">{{ strange.monsterStat }}</span>
    }
  </span>
}
