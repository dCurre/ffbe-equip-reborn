@if (strange(); as strange) {
  <span class="strangeStatsUsed"
    ><span class="warnIcon"><app-icon name="alert" /></span>Uses <span class="stat">{{ strange.stat }}</span>
    @if (strange.monsterStat) {
      to damage monster <span class="monsterStat">{{ strange.monsterStat }}</span>
    }
  </span>
}
