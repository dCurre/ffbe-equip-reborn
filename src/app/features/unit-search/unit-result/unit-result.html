<div class="unit">
  <div class="unitImage"><img [src]="image()" loading="lazy" alt="" /></div>
  <div class="unitDescriptionLines">
    <span class="unitName"><app-wiki-link [name]="unit().name" [always]="true" /></span>
    <div class="killers"><app-killer-list [killers]="killers()" [selected]="killerSelection()" /></div>
    <div class="elementalResistances">
      @for (resist of elementResists(); track resist.name) {
        <span [class]="'elementResistance ' + resist.name" [class.selected]="resist.selected"
          ><i [class]="'img img-element-' + resist.name"></i>{{ resist.value }}%</span
        >
      }
    </div>
    <div class="ailmentResistances">
      @for (resist of ailmentResists(); track resist.name) {
        <span [class]="'ailmentResistance ' + resist.name" [class.selected]="resist.selected"
          ><i [class]="'img img-ailment-' + resist.name"></i>{{ resist.value }}%</span
        >
      }
    </div>
    <span
      class="showAllSkills"
      role="button"
      tabindex="0"
      title="Show all the skills"
      (click)="toggleSkills.emit()"
      (keydown.enter)="toggleSkills.emit()"
      >{{ open() ? '&#9650;' : '&#9660;' }}</span
    >
    <div class="lb">
      @if (showLb()) {
        <app-unit-limit-burst [lb]="unit().lb" />
      }
    </div>
    @for (group of groups(); track group.cls) {
      <div [class]="group.cls + ' skillGroup'">
        @for (skill of group.skills; track skill.id) {
          <app-unit-skill [skill]="skill" />
        }
      </div>
    }
  </div>
</div>
