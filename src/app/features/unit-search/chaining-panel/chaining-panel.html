<app-panel>
  <app-filter-heading
    panelHeading
    [title]="t.chainingFamily"
    [clearable]="skillFilter().chainFamily !== 'none'"
    (cleared)="chooseFamily('none')"
  >
    @if (skillFilter().chainFamily !== 'none') {
      <app-choice-group
        [choices]="areas"
        [selected]="skillFilter().targetAreaTypes"
        (selectedChange)="change({ targetAreaTypes: [...$event] })"
      />
      <app-choice-group
        [choices]="skillTypes"
        [selected]="skillFilter().skillTypes"
        (selectedChange)="change({ skillTypes: [...$event] })"
      />
    }
  </app-filter-heading>
  <div class="line">
    <app-choice-group
      pills
      [single]="true"
      [choices]="families"
      [selected]="family()"
      (selectedChange)="chooseFamily($event[0])"
    />
  </div>
  @if (skillFilter().chainFamily !== 'none') {
    <div class="line">
      <span class="title">{{ t.multicastCount }}</span>
      <select [value]="skillFilter().multicastCount" (change)="chooseMulticast($any($event.target).value)">
        @for (count of multicastCounts; track count.value) {
          <option [value]="count.value">{{ count.label }}</option>
        }
      </select>
    </div>
    @if (skillFilter().multicastCount > 1) {
      <label class="line">
        <input
          type="checkbox"
          [checked]="skillFilter().excludeUnlockedMulticast"
          (change)="change({ excludeUnlockedMulticast: $any($event.target).checked })"
        />
        {{ t.excludeNotAvailableT1 }}
      </label>
    }
  }
</app-panel>
