<app-panel>
  <div panelHeading class="heading">
    <span>Chaining skills</span>
    @if (skillFilter().chainFamily !== 'none') {
      <span class="spacer"></span>
      <app-choice-group
        [choices]="areas"
        [selected]="skillFilter().targetAreaTypes"
        (selectedChange)="change({ targetAreaTypes: [...$event] })"
      />
      <app-choice-group
        [choices]="skillTypes"
        [selected]="skillFilter().skillTypes"
        (selectedChange)="change({ skillTypes: [...$event] })"
      />
    }
  </div>
  <div class="line">
    <span class="title">Chaining family:</span>
    <select [value]="skillFilter().chainFamily" (change)="chooseFamily($any($event.target).value)">
      <option value="none">No filter</option>
      @for (family of families; track family.id) {
        <option [value]="family.id">{{ family.label }}</option>
      }
      <option value="chainTag">Chain by itself</option>
    </select>
  </div>
  @if (skillFilter().chainFamily !== 'none') {
    <div class="line">
      <span class="title">Multicast count:</span>
      <select [value]="skillFilter().multicastCount" (change)="chooseMulticast($any($event.target).value)">
        @for (count of multicastCounts; track count[0]) {
          <option [value]="count[0]">{{ count[1] }}</option>
        }
      </select>
    </div>
    @if (skillFilter().multicastCount > 1) {
      <label class="line">
        <input
          type="checkbox"
          [checked]="skillFilter().excludeUnlockedMulticast"
          (change)="change({ excludeUnlockedMulticast: $any($event.target).checked })"
        />
        Exclude not available T1
      </label>
    }
  }
</app-panel>
