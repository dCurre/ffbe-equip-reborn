<app-panel>
  <div panelHeading class="heading unit-heading">
    <span>{{ t.targetUnit }}</span>
    <app-combobox class="unit-input" [options]="unitNames()" [value]="unitName()" (picked)="chooseUnit($event)" />
    @if (crystal(); as crystal) {
      <span class="rarity">
        <app-icon [name]="crystal" />
        @if (unit()?.max_rarity !== 'NV') {
          {{ unit()?.max_rarity }}★
        }
      </span>
    }
    @if (unit(); as unit) {
      <img class="unit-picture" [src]="'img/units/unit_ills_' + unit.id + '.png'" alt="" />
    }
  </div>
  <div class="base-stats">
    @for (stat of baseStatList; track stat) {
      <label class="input-row">
        <span class="addon">{{ stat.toUpperCase() }}</span>
        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          [placeholder]="stat === 'hp' ? '3500' : '180'"
          [value]="baseStatText()[stat] ?? ''"
          (input)="setBaseStat(stat, $event)"
        />
      </label>
    }
  </div>
</app-panel>
