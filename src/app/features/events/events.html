<app-page-content>
  <app-tab-bar [tabs]="tabs" [active]="view()" (selected)="showView($event)" />
  @if (failed()) {
    <app-alert kind="danger">
      <app-icon name="alert" /> {{ view() === 'story' ? t.errorWhileLoadingStory : t.errorWhileLoading }}
    </app-alert>
  }
  <app-event-table
    [story]="view() === 'story'"
    [events]="events()"
    [loading]="loading()"
    [opened]="opened()"
    [stage]="stage()"
  />
</app-page-content>
