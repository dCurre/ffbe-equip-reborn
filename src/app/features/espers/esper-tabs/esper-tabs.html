<div class="tabs-wrapper">
  <ul class="tabs all">
    <li [class.active]="tab() === 'ALL'" [title]="t.statsOnAllEspers" (click)="selected.emit('ALL')">
      <a><app-icon name="esper-ALL" size="40" /></a>
    </li>
  </ul>
  <div class="scroller">
    <ul class="tabs">
      @for (info of espers(); track info.name) {
        <li
          [class.active]="tab() === info.name"
          [class.not-owned]="!owned()[info.name]"
          [title]="info.name + (owned()[info.name] ? ' (owned)' : ' (not owned)')"
          (click)="selected.emit(info.name)"
        >
          <a><app-icon [name]="sprite(info.name)" size="40" /></a>
        </li>
      }
    </ul>
  </div>
</div>
