<div class="esper-header">
  <div class="form-group esper-choice">
    <div class="form-line">
      <span class="form-label">Name</span><span class="form-value">{{ info().name }}</span>
    </div>
    <div class="form-line">
      <label class="form-label" for="esperStar">Rarity</label>
      <select id="esperStar" (change)="rarityChange.emit($any($event.target).value)">
        @if (logged()) {
          <option value="notOwned" [selected]="!current()">Not owned</option>
        }
        @for (rarity of rarities(); track rarity) {
          <option [value]="rarity" [selected]="current()?.rarity === rarity">{{ rarity }} ★</option>
        }
      </select>
    </div>
    @if (current(); as esper) {
      <div class="form-line">
        <label class="form-label" for="level">Level</label>
        <input
          id="level"
          type="number"
          [min]="levelRange[esper.rarity].min"
          [max]="levelRange[esper.rarity].max"
          [value]="esper.level"
          (input)="levelInput.emit($event)"
          (change)="levelInput.emit($event)"
        />
      </div>
      <div class="form-line">
        <span class="form-label">SP</span>
        <span #spLabel class="form-value" [class.error]="sp()!.used > sp()!.available">
          {{ sp()!.used }} / {{ sp()!.available }}
        </span>
      </div>
    }
  </div>
  <div class="form-line stats" [class.invisible]="!current()">
    @for (group of statGroups; track group[0]) {
      <div class="form-group">
        @for (stat of group; track stat) {
          <div class="form-line">
            <span class="form-label">{{ stat.toUpperCase() }}</span>
            <span class="form-value">
              @if (current(); as esper) {
                {{ value(esper, stat) }}
                <span
                  class="bonus"
                  [title]="
                    'Gives a bonus of +' +
                    bonus(esper, stat) +
                    ' ' +
                    stat.toUpperCase() +
                    ' to unit equipped with this Esper'
                  "
                >
                  (+{{ bonus(esper, stat) }})
                </span>
              }
            </span>
          </div>
        }
      </div>
    }
  </div>
  <div class="form-group other-stats" [class.invisible]="!current()">
    <app-resist-list [resist]="current()?.resist" [bonus]="resistBonus()" />
    <app-killer-list [killers]="current()?.killers" />
  </div>
</div>
