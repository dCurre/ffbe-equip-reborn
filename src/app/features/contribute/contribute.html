<app-page-content>
  <app-page-column [half]="true">
    <app-panel>
      <h2 panelHeading>{{ t.helpImproveFfbeEquip }}</h2>
      <p>{{ t.foundAProblemOr }}</p>
      <div class="actions">
        <a app-button [href]="bugUrl" target="_blank" rel="noreferrer">
          <app-icon name="alert" /> {{ t.reportABug }} <app-icon name="new-window" />
        </a>
        <a app-button [href]="suggestionUrl" target="_blank" rel="noreferrer">
          <app-icon name="thumbs-up" /> {{ t.suggestAnImprovement }} <app-icon name="new-window" />
        </a>
      </div>
    </app-panel>
    <app-panel>
      <h2 panelHeading>{{ t.supportTheSite }}</h2>
      <p>{{ t.theSiteIsFree }}</p>
      <div class="actions">
        <a app-button [href]="koFiUrl" target="_blank" rel="noreferrer">
          <!-- decorative: the text beside it says Ko-fi -->
          <app-icon name="kofi" height="20" title="" /> {{ t.supportOnKoFi }} <app-icon name="new-window" />
        </a>
      </div>
    </app-panel>
    <app-site-footer />
  </app-page-column>
</app-page-content>
