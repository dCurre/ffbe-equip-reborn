<app-page-content>
  <app-page-column [half]="true">
    <app-panel [heading]="t.helpImproveFfbeEquip">
      <p>{{ t.foundAProblemOr }}</p>
      <button app-button (click)="openIssue('bug_report.yml')"><app-icon name="alert" /> {{ t.reportABug }}</button>
      <button app-button (click)="openIssue('suggestion.yml')">
        <app-icon name="thumbs-up" /> {{ t.suggestAnImprovement }}
      </button>
    </app-panel>
    <app-site-footer />
  </app-page-column>
</app-page-content>
