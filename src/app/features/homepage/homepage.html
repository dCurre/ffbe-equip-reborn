<section #mainmenu class="mainmenu" style="--fixed-background: url(img/homepage/background-fixed/background-fixed.jpg)">
  <div class="content">
    @for (line of lines; track $index) {
      <div class="line">
        @for (button of line; track button.path) {
          <a
            class="button"
            [routerLink]="button.path"
            [queryParams]="serverContext.linkParams()"
            style="background-image: url(img/homepage/button.png)"
          >
            <span class="title">{{ button.title }}</span>
            <i
              class="illustration"
              [class]="button.character"
              [style.background-image]="'url(img/banner/' + button.character + '.png)'"
            ></i>
          </a>
        }
        @if ($first) {
          <div class="kuppo" style="background-image: url(img/homepage/kuppo_message.png)">
            Find the best equipments for your units, kupo!
          </div>
        }
      </div>
    }
  </div>
  <div class="layer layer-1" style="background-image: url(img/homepage/backgrounds/background-1.jpg)"></div>
  <div class="layer layer-2" style="background-image: url(img/homepage/backgrounds/background-2.png)"></div>
  <div class="layer layer-3" style="background-image: url(img/homepage/backgrounds/background-3.png)"></div>
  <div class="layer layer-4" style="background-image: url(img/homepage/backgrounds/background-4.png)"></div>
  <div class="layer-border">
    <div class="side-left" style="background-image: url(img/homepage/border-left.png)"></div>
    <div class="side-fill" style="background-image: url(img/homepage/border-fill.png)"></div>
    <div class="side-right" style="background-image: url(img/homepage/border-right.png)"></div>
  </div>
</section>
<app-site-footer />
