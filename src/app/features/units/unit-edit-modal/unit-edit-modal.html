<app-modal [heading]="'Edit ' + (unit()?.name ?? '')" [(open)]="open">
  <form class="edit-form" (submit)="$event.preventDefault(); save()">
    @if (canEdit('nv')) {
      <label>Owned NV number <input type="number" name="nv" [(ngModel)]="edit.nv" /></label>
    }
    @if (canEdit('sevenStar')) {
      <label>Owned 7* number <input type="number" name="sevenStar" [(ngModel)]="edit.sevenStar" /></label>
    }
    @if (canEdit('number')) {
      <label>Owned 6* or under number <input type="number" name="number" [(ngModel)]="edit.number" /></label>
    }
    @if (canEdit('stmr')) {
      <label>
        Number of STMR that can still be farmed
        <input type="number" name="farmableStmr" [(ngModel)]="edit.farmableStmr" />
      </label>
    }
    <label>
      Number of TMR that can still be farmed <input type="number" name="farmable" [(ngModel)]="edit.farmable" />
    </label>
    @if (canEdit('nvExtras')) {
      <label
        >Owned Fragment number <input type="number" step="5" name="fragments" [(ngModel)]="edit.fragments"
      /></label>
      <label>EX Level <input type="number" name="exRank" [(ngModel)]="edit.exRank" /></label>
    }
    @if (canEdit('moogles')) {
      <label>
        TMR Moogles owned
        <input
          type="text"
          name="tmrMoogles"
          placeholder="Enter values of tmr moogles, separated by comma"
          [(ngModel)]="edit.tmrMoogles"
        />
      </label>
    }
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </form>
  <ng-container modalFooter>
    <button app-button type="button" (click)="open.set(false)">Cancel</button>
    <button app-button type="button" (click)="save()">Save</button>
  </ng-container>
</app-modal>
