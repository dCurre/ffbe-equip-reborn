<app-modal [heading]="'Edit ' + (unit()?.name ?? '')" confirmLabel="Save" [(open)]="open" (confirmed)="save()">
  <form class="edit-form" (submit)="$event.preventDefault(); save()">
    @if (canEdit('nv')) {
      <label>{{ t.nvOwned }} <input type="number" min="0" name="nv" [(ngModel)]="edit.nv" /></label>
    }
    @if (canEdit('sevenStar')) {
      <label>{{ t.n7Owned }} <input type="number" min="0" name="sevenStar" [(ngModel)]="edit.sevenStar" /></label>
    }
    @if (canEdit('number')) {
      <label>{{ t.n6OrUnderOwned }} <input type="number" min="0" name="number" [(ngModel)]="edit.number" /></label>
    }
    @if (canEdit('tmr')) {
      <label>
        {{ t.tmrOwned }}
        <input type="number" min="0" [max]="max().tmr" name="tmrOwned" [(ngModel)]="owned.tmr" />
      </label>
    }
    @if (canEdit('stmr')) {
      <label>
        {{ t.stmrOwned }}
        <input type="number" min="0" [max]="max().stmr" name="stmrOwned" [(ngModel)]="owned.stmr" />
      </label>
    }
    @if (canEdit('nvExtras')) {
      <label
        >{{ t.fragmentsOwned }} <input type="number" min="0" step="5" name="fragments" [(ngModel)]="edit.fragments"
      /></label>
      <label>{{ t.exLevel }} <input type="number" min="0" max="3" name="exRank" [(ngModel)]="edit.exRank" /></label>
    }
    @if (canEdit('moogles')) {
      <label class="stacked">
        {{ t.tmrMooglesOwned }}
        <input type="text" name="tmrMoogles" [placeholder]="t.enterValuesOfTmr" [(ngModel)]="edit.tmrMoogles" />
      </label>
    }
    @if (error()) {
      <app-alert kind="danger">{{ error() }}</app-alert>
    }
  </form>
</app-modal>
