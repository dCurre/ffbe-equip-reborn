<app-modal [heading]="'Awaken ' + (unit()?.name ?? '')" [(open)]="open">
  <p>{{ t.howToAwaken }}</p>
  <div class="modal-choices">
    <button app-button type="button" (click)="chosen.emit(2)">{{ t.awakenUsing2Units }}</button>
    <button app-button type="button" (click)="chosen.emit(1)">{{ t.awakenUsing1Unit }}</button>
  </div>
</app-modal>
