<app-modal [heading]="heading()" confirmLabel="Import" [(open)]="open" (confirmed)="confirmed.emit()">
  @if (warning()) {
    <p class="warning">{{ warning() }}</p>
  }
  <input type="file" accept=".json,application/json" (change)="chooseFile($event)" />
  <p>
    <a [href]="gameDataUrl" target="_blank" rel="noreferrer">Instructions to import your data directly from the game</a>
  </p>
  <p>{{ summary() }}</p>
  @for (message of messages(); track $index) {
    <p class="error">{{ message }}</p>
  }
</app-modal>
