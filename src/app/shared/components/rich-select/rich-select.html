<button type="button" class="trigger" [attr.aria-expanded]="open()" (click)="toggle()">
  @if (current(); as option) {
    <ng-container *ngTemplateOutlet="row; context: { $implicit: option }" />
  } @else {
    <span class="placeholder">{{ placeholder() }}</span>
  }
  <app-icon class="caret" name="caret-down" />
</button>
@if (open()) {
  <div class="menu">
    <input
      type="text"
      class="search"
      autocomplete="off"
      placeholder="Search"
      aria-label="Search"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
      (keydown.escape)="open.set(false)"
    />
    <ul>
      @for (option of shown(); track option.value) {
        <li>
          <a
            [class.selected]="option.value === value()"
            [class.disabled]="option.disabled"
            (click)="pick(option)"
          >
            <ng-container *ngTemplateOutlet="row; context: { $implicit: option }" />
          </a>
        </li>
      } @empty {
        <li class="empty">No results</li>
      }
    </ul>
  </div>
}

<ng-template #row let-option>
  <span class="row" [class.disabled]="option.disabled">
    @if (option.icon) {
      <img class="picture" [src]="option.icon" alt="" />
    }
    <span class="label">{{ option.label }}</span>
    @if (option.mark) {
      <span class="mark" [title]="option.markTitle ?? ''">{{ option.mark }}</span>
    }
    @if (option.tag) {
      <span class="tag" [attr.data-kind]="option.tagKind">{{ option.tag }}</span>
    }
  </span>
</ng-template>
