<label class="box">
  <app-icon name="search" />
  <input
    #field
    class="search"
    type="text"
    [placeholder]="placeholder()"
    [attr.aria-label]="placeholder()"
    [value]="text()"
    (input)="type($any($event.target).value)"
  />
  @if (text()) {
    <button
      app-button
      variant="flat"
      type="button"
      class="clear"
      [title]="t.clearTheSearch"
      [attr.aria-label]="t.clearTheSearch"
      (click)="clear()"
    >
      <app-icon name="remove" />
    </button>
  }
</label>
