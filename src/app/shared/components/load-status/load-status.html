@if (!ready()) {
  <app-alert><app-icon name="info" /> {{ t.pleaseWaitFor }} {{ subject() }} {{ t.toLoad }}</app-alert>
} @else if (loginNeeded()) {
  <app-alert kind="danger">
    <app-icon name="alert" /> {{ t.youNeedToBe }} {{ subject() }}
    @if (note()) {
      . <strong>{{ note() }}</strong>
    }
  </app-alert>
}
