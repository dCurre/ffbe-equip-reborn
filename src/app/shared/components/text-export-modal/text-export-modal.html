<app-modal [heading]="heading()" [(open)]="open">
  <textarea class="text-export" readonly [rows]="rows()" [value]="text()" (focus)="select($event)"></textarea>
  <ng-container modalFooter>
    <button app-button type="button" (click)="copy.emit()">Copy</button>
    <button app-button type="button" (click)="open.set(false)">Close</button>
  </ng-container>
</app-modal>
