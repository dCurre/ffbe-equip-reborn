<dialog #dialog [class.wide]="wide()" (close)="open.set(false)" (click)="closeOnBackdrop($event)">
  <div class="header">
    <h4>{{ heading() }}</h4>
    <button app-button variant="flat" type="button" class="close" [attr.aria-label]="t.close" (click)="open.set(false)">
      <app-icon name="remove" />
    </button>
  </div>
  <div class="body"><ng-content /></div>
  <div class="footer">
    <ng-content select="[modalFooter]" />
    <button app-button type="button" (click)="open.set(false)">
      {{ closeLabel() || (confirmLabel() ? 'Cancel' : 'Close') }}
    </button>
    @if (confirmLabel()) {
      <button app-button variant="primary" type="button" [class.danger]="danger()" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    }
  </div>
</dialog>
