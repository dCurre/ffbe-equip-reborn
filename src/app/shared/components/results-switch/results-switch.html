<button
  app-button
  variant="flat"
  type="button"
  class="side-button"
  [attr.aria-label]="showingResults() ? 'Show the filters' : 'Show the results'"
  (click)="toggle()"
>
  <app-icon [name]="showingResults() ? 'settings' : 'search'" />
</button>
@if (icons().length || killers()) {
  <div class="filter-summary">
    @for (icon of icons(); track $index) {
      <app-icon [name]="icon" />
    }
    @if (killers()) {
      <app-icon name="killer" />
    }
  </div>
}
