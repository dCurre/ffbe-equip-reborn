<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>FFBE Equip Reborn : Espers</title>
        <link rel="icon" type="image/png" href="img/icons/equipments/heavyArmor.png">

        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css"
              integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="css-img/espers.css">
        <link rel="stylesheet" type="text/css" href="css-img/equipments.css">
        <link rel="stylesheet" type="text/css" href="css-img/elements.css">
        <link rel="stylesheet" type="text/css" href="css-img/ailments.css">
        <link rel="stylesheet" type="text/css" href="css-img/killers.css">
		<link rel="stylesheet" type="text/css" href="common.css">
        <link rel="stylesheet" type="text/css" href="espers.css">
        <link rel="stylesheet" type="text/css" href="languages.css">
        <link rel="stylesheet" type="text/css" href="dark-mode.css"/>
    </head>
    <body class="dark">
        <span id="toggleGrid" class="hidden" title="Toggle Esper training grid">
            <span class="glyphicon glyphicon-th"></span>
            <span class="glyphicon glyphicon-list hidden"></span>
        </span>
        
        <script src="layout.js" data-part="header" data-page="espers.html" data-title="Espers" data-header-class="headerNichol"></script>
        <div class="container-fluid">
            <span class="glassPanel hidden"></span>
            <div style="text-align: center">
                <div id="pleaseWaitMessage" class="alert alert-info alert-inline" role="alert">
                    <span class="glyphicon glyphicon-info-sign"></span>
                    Please wait for your Espers to load
                </div>
                <div id="loginMessage" class="alert alert-danger alert-inline hidden" role="alert">
                    <span class="glyphicon glyphicon-alert"></span>
                    You need to be logged-in to manage your Espers.
                    <span id="notLoginWarningMessage" class="hidden">
                        <strong>Changes made won't be saved.</strong>
                    </span>
                </div>
            </div>
            <div id="espers" class="hidden">
                <div class="tabsWrapper">
                    <ul id="tabs" class="nav nav-tabs"></ul>
                </div>
                <div id="allEspers">
                    <a id="importLink" class="link action" onclick="importEspers();">
                        <span class="glyphicon glyphicon-save"></span>
                        <span class="text hidden-xs hidden-sm">
                            Import Espers
                        </span>
                    </a>

                    <div id="noEsperMessage" class="alert alert-info" role="alert">
                        <span class="glyphicon glyphicon-info-sign"></span>
                        You don't own any espers yet...
                    </div>

                    <div class="panel panel-default">
                        <table class='allEspers table'>
                            <thead>
                                <tr>
                                    <th class="index active desc" onclick="sortTableBy('index')">Esper</th>
                                    <th class="level" onclick="sortTableBy('level')">Level</th>
                                    <th class="hp" onclick="sortTableBy('hp')">HP</th>
                                    <th class="mp" onclick="sortTableBy('mp')">MP</th>
                                    <th class="atk" onclick="sortTableBy('atk')">ATK</th>
                                    <th class="def" onclick="sortTableBy('def')">DEF</th>
                                    <th class="mag" onclick="sortTableBy('mag')">MAG</th>
                                    <th class="spr" onclick="sortTableBy('spr')">SPR</th>
                                    <th class="resists" onclick="sortTableBy('resists')">Resists</th>
                                    <th class="killers" onclick="sortTableBy('killers')">Killers</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Filled by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div id="esper" class="hidden">
                    <div class="esperHeader">
                        <div class="formGroup esperChoice">
                            <div class="formLine">
                                <label for="esperName" class="formLabel">Name</label>
                                <span id="esperName" class="formValue"></span>
                            </div>
                            <div class="formLine">
                                <label for="esperStar" class="formLabel">Rarity</label>
                                <select id="esperStar" class="form-control formInput"></select>
                            </div>

                            <div class="formLine levelLine">
                                <label for="level" class="formLabel">Level</label>
                                <input id="level" type="number" class="form-control formInput"/>
                            </div>

                            <div class="formLine spLine">
                                <label for="sp" class="formLabel">SP</label>
                                <span id="sp" class="formValue spUsed"></span>
                            </div>
                        </div>
                        <div class="formLine stats invisible">
                            <div class="formGroup">
                                <div class="formLine">
                                    <label class="formLabel">HP</label>
                                    <span id="esper_hp" class="formValue"></span>
                                </div>
                                <div class="formLine">
                                    <label class="formLabel">ATK</label>
                                    <span id="esper_atk" class="formValue"></span>
                                </div>
                                <div class="formLine">
                                    <label class="formLabel">MAG</label>
                                    <span id="esper_mag" class="formValue"></span>
                                </div>
                            </div>
                            <div class="formGroup">
                                <div class="formLine">
                                    <label class="formLabel">MP</label>
                                    <span id="esper_mp" class="formValue"></span>
                                </div>
                                <div class="formLine">
                                    <label class="formLabel">DEF</label>
                                    <span id="esper_def" class="formValue"></span>
                                </div>
                                <div class="formLine">
                                    <label class="formLabel">SPR</label>
                                    <span id="esper_spr" class="formValue"></span>
                                </div>
                            </div>
                        </div>
                        <div class="formGroup esperOtherStats invisible">
                            <span id="esperResist" class="formLine"></span>
                            <span id="esperSkills" class="formLine"></span>
                        </div>
                    </div>
                    <div class="formLine shareLink">
                        <a class="btn btn-default" onclick="getPublicEsperLink()">
                            <span class="glyphicon glyphicon-link"></span>
                            Get a link to this Esper build
                        </a>
                    </div>
                    <div id="panWrapper">
                        <div id="spFixed">
                            <span class="name">SP</span>
                            <span class="spUsed"></span>
                        </div>
                        <div id="gridTrimmer">
                            <div id="gridContainer">
                                <ul id="grid" class="clear">
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="layout.js" data-part="footer"></script>
        <script src="lib/jquery-3.7.1.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"
                integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
		<script src="lib/jquery.ba-throttle-debounce.min.js"></script>
        <script src="lib/notify.min.js"></script>
        <script src="lib/jjv.js"></script>
        <script src="constants.js"></script>
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script src="googleDrive.js"></script>
        <script src="common.js"></script>
		<script src="espers.js"></script>
        <script src="lib/jquery.line.js"></script>
    </body>
</html>
